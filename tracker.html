
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6fc;
  color: #17233c;
  padding: 24px;
}

.container {
  max-width: 1000px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
}

header h1 {
  color: #245de8;
  margin-bottom: 6px;
}

header p {
  color: #64748b;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: #245de8;
  color: white;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.card, .panel {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 4px 15px #17233c0a;
}

.card p {
  color: #64748b;
  margin-bottom: 12px;
}

.card h2 {
  font-size: 24px;
  overflow-wrap: anywhere;
}

.income { border-top: 4px solid #16a36a; }
.expenses { border-top: 4px solid #ef5261; }
.balance { border-top: 4px solid #3478f6; }

.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 20px;
  align-items: start;
}

h3 {
  margin-bottom: 18px;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-size: 14px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d6deeb;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

form button {
  width: 100%;
  margin-top: 18px;
}

.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.filters select {
  min-width: 0;
}

.transaction {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #e8edf5;
}

.transaction:last-child {
  border-bottom: none;
}

.transaction small {
  display: block;
  color: #64748b;
  margin-top: 5px;
}

.amount {
  font-weight: bold;
  white-space: nowrap;
}

.plus { color: #159760; }
.minus { color: #e44959; }

.delete {
  background: #fff0f1;
  color: #cf3345;
  padding: 7px 9px;
  margin-left: 5px;
}

.empty {
  color: #64748b;
  text-align: center;
  padding: 25px 0;
}

@media (max-width: 700px) {
  body { padding: 14px; }

  header {
    align-items: flex-start;
    flex-direction: column;
  }

  .summary {
    grid-template-columns: 1fr;
  }

  .layout {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<div class="container">

  <header>
    <div>
      <h1>💰 Expense Tracker</h1>
      <p>Track your money. Manage it better.</p>
    </div>
    <button class="primary" onclick="clearAll()">
      Clear All
    </button>
  </header>

  <section class="summary">
    <div class="card income">
      <p>Total Income</p>
      <h2 id="totalIncome">₹0</h2>
    </div>

    <div class="card expenses">
      <p>Total Expenses</p>
      <h2 id="totalExpenses">₹0</h2>
    </div>

    <div class="card balance">
      <p>Current Balance</p>
      <h2 id="balance">₹0</h2>
    </div>
  </section>

  <div class="layout">

    <section class="panel">
      <h3>Add Transaction</h3>

      <form id="transactionForm">
        <label for="type">Transaction Type</label>
        <select id="type" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <label for="amount">Amount (₹)</label>
        <input
          id="amount"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="Enter amount"
          required
        >

        <label for="category">Category</label>
        <select id="category" required>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Salary</option>
          <option>Freelance</option>
          <option>Other</option>
        </select>

        <label for="date">Date</label>
        <input id="date" type="date" required>

        <label for="description">Description</label>
        <input
          id="description"
          type="text"
          maxlength="80"
          placeholder="e.g. Lunch, bus fare"
        >

        <button class="primary" type="submit">
          + Add Transaction
        </button>
      </form>
    </section>

    <section class="panel">
      <h3>Transaction History</h3>

      <div class="filters">
        <select id="filterType" aria-label="Filter by type">
          <option value="all">All Transactions</option>
          <option value="income">Income Only</option>
          <option value="expense">Expenses Only</option>
        </select>

        <select id="filterCategory" aria-label="Filter by category">
          <option value="all">All Categories</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Salary</option>
          <option>Freelance</option>
          <option>Other</option>
        </select>
      </div>

      <div id="transactions"></div>
    </section>

  </div>
</div>

<script>
const form = document.getElementById("transactionForm");
const typeInput = document.getElementById("type");
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const dateInput = document.getElementById("date");
const descriptionInput = document.getElementById("description");
const transactionsBox = document.getElementById("transactions");

let transactions = [];

try {
  transactions = JSON.parse(
    localStorage.getItem("expenseTrackerData") || "[]"
  );

  if (!Array.isArray(transactions)) transactions = [];
} catch {
  transactions = [];
}

dateInput.value = new Date().toLocaleDateString("en-CA");

function money(amount) {
  return amount.toLocaleString("en-IN", {
    style: "currency",
    currency: "INR",
    maximumFractionDigits: 2
  });
}

function saveData() {
  localStorage.setItem(
    "expenseTrackerData",
    JSON.stringify(transactions)
  );
}

function updateSummary() {
  const income = transactions
    .filter(item => item.type === "income")
    .reduce((sum, item) => sum + item.amount, 0);

  const expenses = transactions
    .filter(item => item.type === "expense")
    .reduce((sum, item) => sum + item.amount, 0);

  document.getElementById("totalIncome").textContent =
    money(income);

  document.getElementById("totalExpenses").textContent =
    money(expenses);

  document.getElementById("balance").textContent =
    money(income - expenses);
}

function renderTransactions() {
  const filterType = document.getElementById("filterType").value;
  const filterCategory =
    document.getElementById("filterCategory").value;

  const filtered = transactions
    .filter(item =>
      filterType === "all" || item.type === filterType
    )
    .filter(item =>
      filterCategory === "all" ||
      item.category === filterCategory
    )
    .slice()
    .reverse();

  transactionsBox.replaceChildren();

  if (filtered.length === 0) {
    const message = document.createElement("p");
    message.className = "empty";
    message.textContent = "No transactions yet. Add one!";
    transactionsBox.appendChild(message);
    return;
  }

  filtered.forEach(item => {
    const row = document.createElement("div");
    row.className = "transaction";

    const details = document.createElement("div");
    const title = document.createElement("strong");
    title.textContent = item.description || item.category;

    const meta = document.createElement("small");
    meta.textContent = `${item.category} • ${item.date}`;

    details.append(title, meta);

    const right = document.createElement("div");
    const amount = document.createElement("span");
    amount.className = "amount " +
      (item.type === "income" ? "plus" : "minus");

    amount.textContent =
      `${item.type === "income" ? "+" : "−"}${money(item.amount)}`;

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.setAttribute("aria-label", "Delete transaction");

    deleteButton.addEventListener("click", () => {
      transactions = transactions.filter(
        transaction => transaction.id !== item.id
      );
      saveData();
      updateSummary();
      renderTransactions();
    });

    right.append(amount, deleteButton);
    row.append(details, right);
    transactionsBox.appendChild(row);
  });
}

form.addEventListener("submit", event => {
  event.preventDefault();

  const amount = Number(amountInput.value);

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Please enter an amount greater than zero.");
    return;
  }

  const transaction = {
    id: Date.now() + Math.random(),
    type: typeInput.value,
    amount,
    category: categoryInput.value,
    date: dateInput.value,
    description: descriptionInput.value.trim()
  };

  transactions.push(transaction);
  saveData();

  form.reset();
  dateInput.value = new Date().toLocaleDateString("en-CA");

  updateSummary();
  renderTransactions();
});

document.getElementById("filterType")
  .addEventListener("change", renderTransactions);

document.getElementById("filterCategory")
  .addEventListener("change", renderTransactions);

function clearAll() {
  if (!transactions.length) return;

  if (confirm("Delete all transactions? This cannot be undone.")) {
    transactions = [];
    saveData();
    updateSummary();
    renderTransactions();
  }
}

updateSummary();
renderTransactions();
</script>
</body>
</html>
